syntax = "proto3";

package mflow;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// Request to generate a cash-flow timeline until `end`.
message GenerateTimelineRequest {
  // If omitted, server may choose a sensible default (e.g. one year from now).
  google.protobuf.Timestamp end = 1;
}

// Single payment entry in a timeline
message Payment {
  google.protobuf.Timestamp date = 1;
  double amount = 2; // numeric amount in the provided currency
  string currency = 3; // currency code, e.g. "USD" or "PYG"
}

// All payments for a given country / instrument
message CountryTimeline {
  string country = 1;
  repeated Payment payments = 2;
}

// Response containing timelines for multiple instruments/countries
message GenerateTimelineResponse {
  repeated CountryTimeline timelines = 1;
}

// Messages and service for listing assets
message ListAssetsRequest {
  bool print_pos = 1;
  bool print_neg = 2;
}

message AssetEntry {
  string identifier = 1;
  string formatted = 2;
}

message CurrencySummaryItem {
  string currency = 1;
  double positive_value = 2;
  double negative_value = 3;
}

message ReturnHistoryItem {
  double current_value = 1;
  double current_return = 2;
  string identifier = 3;
}

message ListAssetsResponse {
  repeated CurrencySummaryItem currency_summary = 1;
  repeated ReturnHistoryItem return_history = 2;
  repeated AssetEntry positives = 3;
  repeated AssetEntry negatives = 4;
}

message BoolResponse {
  bool success = 1; // The boolean field to return
}

service CashFlowService {
  // Produce upcoming payment timeline grouped by country/instrument
  rpc GenerateTimeline (GenerateTimelineRequest) returns (GenerateTimelineResponse);

  // List assets (positives/negatives, currency summary, return history)
  rpc ListAssets (ListAssetsRequest) returns (ListAssetsResponse);
  rpc ClearCache (google.protobuf.Empty) returns (BoolResponse);
}
